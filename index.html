<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="bg-container"></div>

    <div class="container">
        <h1>Can you be my Valentine?</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes 💖</button>
            <button id="noBtn">No 😅</button>
        </div>
    </div>

    <div id="loveModal" class="modal">
        <div class="modal-content">
            <h2>Yay! I love you! ❤️</h2>
            <p>
                My Dearest, <br><br>
                I'm so happy you said yes! You make my world brighter and my heart lighter. 
                I promise to buy you chocolates, give you warm hugs, and always make you smile.
                <br><br>
                Happy Valentine's Day! 🌹
            </p>
            <br>
            <div style="font-size: 3rem;">🐻💐💑</div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-dreaming-big-31.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
